name: automation-hooks
version: 1.0.0
description: 위험 동작 차단(PreToolUse) · 편집 직후 정합성 자동 검증(PostToolUse) · 종료 시 DEVLOG 유도(Stop) 3종 훅
authors: [ria.sunmin]
requires:
  core: ">=1.0"
recommends:
  designspec: ">=1.0"  # pre-danger-guard가 designspec의 형상관리 불변식(동결본·.baseline/) 을 검사. designspec 팩 없어도 동작하나 실효 최대는 designspec과 함께.

files:
  - src: .claude/hooks/pre-danger-guard.py
    dst: .claude/hooks/pre-danger-guard.py
    mode: "755"
  - src: .claude/hooks/post-edit-check.py
    dst: .claude/hooks/post-edit-check.py
    mode: "755"
  - src: .claude/hooks/stop-devlog.py
    dst: .claude/hooks/stop-devlog.py
    mode: "755"

# settings.json 은 병합 필요 — kit-install 이 기존 파일 있으면 hooks 키만 병합
merge:
  - target: .claude/settings.json
    src: .claude/settings.snippet.json
    strategy: json-merge  # 최상위 hooks 키를 병합, 다른 키(permissions 등)는 보존

inject:
  - target: CLAUDE.md
    slot: hooks
    lines:
      - "- **PreToolUse — 위험 동작 차단**(`pre-danger-guard.py`): 버전 라벨 블랭킷 치환(`sed …/g`) · 동결본 `_vX.Y.{html,pdf}` 변경 · `.baseline/` 직접 손질 · 광범위 `rm -rf` 를 막는다. `release-cut.sh` 경유는 통과."
      - "- **PostToolUse — 정합성 자동 검증**(`post-edit-check.py`): `docs/**.md` · 라이브 `prototype/**.designspec.html` 편집 직후 `scripts/check-docs.sh` 실행. FAIL 시 경고만 surface(흐름은 막지 않음)."
      - "- **Stop — DEVLOG 유도**(`stop-devlog.py`): 문서를 편집한 세션인데 `DEVLOG.md` 에 오늘 항목이 없으면 한 번 막고 작성을 유도한다."

uninstall:
  - "files 목록의 dst 삭제"
  - ".claude/settings.json 의 hooks 키에서 3개 항목 제거 (다른 키 보존)"
  - "CLAUDE.md PACK-SLOT:hooks 에 주입된 3줄 제거"
